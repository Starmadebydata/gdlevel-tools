<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" fill="none">
  <!-- GD 风格无缝几何纹理 — 可平铺用作背景图案 -->
  <!-- 方块 -->
  <rect x="5" y="5" width="14" height="14" rx="3" stroke="#00e5ff" stroke-width="1" opacity="0.12"/>
  <rect x="35" y="35" width="14" height="14" rx="3" stroke="#b388ff" stroke-width="1" opacity="0.1"/>
  <!-- 三角形 -->
  <path d="M45 10 L52 3 L52 17 Z" stroke="#00e5ff" stroke-width="1" opacity="0.1"/>
  <path d="M10 45 L3 52 L17 52 Z" stroke="#b388ff" stroke-width="1" opacity="0.1"/>
  <!-- 小方块 -->
  <rect x="25" y="25" width="6" height="6" rx="1" fill="#ffd54f" opacity="0.08"/>
  <!-- 连接线 -->
  <line x1="12" y1="12" x2="28" y2="28" stroke="#00e5ff" stroke-width="0.5" opacity="0.06"/>
  <line x1="42" y1="42" x2="28" y2="28" stroke="#b388ff" stroke-width="0.5" opacity="0.06"/>
  <!-- 圆点 -->
  <circle cx="30" cy="8" r="1.5" fill="#00e5ff" opacity="0.15"/>
  <circle cx="8" cy="30" r="1.5" fill="#b388ff" opacity="0.12"/>
  <circle cx="52" cy="30" r="1.5" fill="#ffd54f" opacity="0.1"/>
  <circle cx="30" cy="52" r="1.5" fill="#00e5ff" opacity="0.12"/>
</svg>
