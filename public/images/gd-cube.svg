<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- GD 风格玩家方块 — Hero 区域中央装饰 -->
  <defs>
    <linearGradient id="cubeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00b8d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 外层光晕方块 -->
  <rect x="50" y="50" width="100" height="100" rx="16" stroke="#00e5ff" stroke-width="2" opacity="0.2" filter="url(#glow)"/>
  <!-- 主方块 -->
  <rect x="60" y="60" width="80" height="80" rx="12" fill="url(#cubeGrad)" opacity="0.15" stroke="#00e5ff" stroke-width="2.5" filter="url(#glow)"/>
  <!-- 内部图案 — GD 风格眼睛/面板 -->
  <rect x="75" y="75" width="50" height="50" rx="8" fill="#00e5ff" opacity="0.2"/>
  <!-- 中心点 -->
  <circle cx="100" cy="100" r="8" fill="#00e5ff" opacity="0.6" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="4" fill="#ffffff" opacity="0.8"/>
  <!-- 四角小方块 -->
  <rect x="70" y="70" width="8" height="8" rx="2" fill="#00e5ff" opacity="0.4"/>
  <rect x="122" y="70" width="8" height="8" rx="2" fill="#00e5ff" opacity="0.4"/>
  <rect x="70" y="122" width="8" height="8" rx="2" fill="#00e5ff" opacity="0.4"/>
  <rect x="122" y="122" width="8" height="8" rx="2" fill="#00e5ff" opacity="0.4"/>
</svg>
